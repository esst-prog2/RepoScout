[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcout"
version = "0.1.0"
description = "Search GitHub repos by keyword and get a ranked, activity-bucketed report."
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "typer==0.27.2",
    "tabulate==0.10.0",
    "humanize==4.16.0",
    "platformdirs==4.11.12",
    "pwinput==1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "responses==0.26.3",
]

[project.scripts]
reposcout = "reposcout.cli:app"

[tool.setuptools.packages.find]
include = ["reposcout*"]
