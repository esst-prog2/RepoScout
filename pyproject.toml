[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcout"
version = "0.1.0"
description = "Search GitHub repos by keyword and get a ranked, activity-bucketed report."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "tabulate>=0.9",
    "humanize>=4.9",
    "platformdirs>=4.0",
    "pwinput>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
reposcout = "reposcout.cli:app"

[tool.setuptools.packages.find]
include = ["reposcout*"]
