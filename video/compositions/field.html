<template>
  <style>
    @font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%;
      src: url("assets/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; background: #fdfafa; font-family: "Archivo", sans-serif; color: #24161a; }
    #f-head { position: absolute; left: 192px; top: 130px; font-size: 72px; font-weight: 800; font-stretch: 75%;
      letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    #f-head span { font-weight: 500; font-stretch: 100%; font-size: 44px; color: #6a5357; letter-spacing: 0; }
    #f-canvas { position: absolute; left: 192px; top: 270px; }
    .f-line { position: absolute; left: 192px; top: 830px; font-size: 56px; font-weight: 700; font-stretch: 80%;
      letter-spacing: -0.01em; }
    #f-line2 em { font-style: normal; color: #b3122e; }
  </style>
  <div id="root" data-composition-id="field" data-width="1920" data-height="1080">
    <div id="f-head" class="clip" data-start="0" data-duration="5.1">14,067 <span>matching repos, one mark each</span></div>
    <canvas id="f-canvas" class="clip" data-start="0" data-duration="5.1" width="1407" height="490"></canvas>
    <div id="f-line1" class="f-line clip" data-start="0" data-duration="2.9">GitHub ranks them by how well they match</div>
    <div id="f-line2" class="f-line clip" data-start="2.9" data-duration="2.2">RepoScout reads the <em>50 best</em></div>
  </div>
  <script>
    (function () {
      const N = window.RS.total, COLS = 201, PITCH = 7, MARK = 4, PICK = window.RS.shown;
      const ctx = document.querySelector("#f-canvas").getContext("2d");
      const s = { t: 0 };
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const ease = (v) => 1 - Math.pow(1 - v, 3);
      function draw(t) {
        ctx.clearRect(0, 0, 1407, 490);
        const rows = Math.ceil(N / COLS);
        const shown = Math.floor(clamp((t - 0.2) / 1.0) * rows);          // prints row by row
        const pick = ease(clamp((t - 2.6) / 0.4));                          // the 50 are chosen
        for (let i = 0; i < N; i++) {
          const r = Math.floor(i / COLS), c = i % COLS;
          if (r > shown) break;
          const x = c * PITCH, y = r * PITCH;
          if (i < PICK) {
            const sz = MARK + pick * 2;
            ctx.fillStyle = pick > 0 ? `rgb(${Math.round(36 + pick * (179 - 36))},${Math.round(22 - pick * 4)},${Math.round(26 + pick * 20)})` : "#24161a";
            ctx.fillRect(x - (sz - MARK) / 2, y - (sz - MARK) / 2, sz, sz);
          } else {
            ctx.globalAlpha = 1 - pick * 0.82;
            ctx.fillStyle = "#6a5357";
            ctx.fillRect(x, y, MARK, MARK);
            ctx.globalAlpha = 1;
          }
        }
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(s, { t: 0 }, { t: 5.1, duration: 5.1, ease: "none", onUpdate: () => draw(s.t) }, 0);
      tl.fromTo("#f-head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0);
      tl.fromTo("#f-line1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.6);
      tl.to("#f-line1", { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power3.in" }, 2.72);
      tl.fromTo("#f-line2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.9);
      tl.to("#f-head, #f-canvas, #f-line2", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power3.in" }, 4.9);
      draw(0);
      window.__timelines["field"] = tl;
    })();
  </script>
</template>
